<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление сценами</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- МОДАЛЬНОЕ ОКНО 1: Создание сцены (/scene) -->
  <div id="sceneApp" class="modal-overlay" style="display: none;">
    <div id="sceneWindow" class="modal-card">
      <div class="modal-header" id="sceneModalHeader">
        <div class="header-left">
          <h2>Создание 3D сцены</h2>
        </div>
        <button id="btnCloseHeader" class="close-btn" title="Закрыть (Esc)">&times;</button>
      </div>

      <div class="modal-body">
        <div class="section-box">
          <div class="section-header-row">
            <span class="section-badge">Текст сцены</span>
            <span id="charCounter" class="char-counter">0 / 250</span>
          </div>
          <p class="section-desc">Опишите детали окружения или оставьте RP-заметку в мире.</p>
          <textarea id="sceneText" class="text-input textarea-input" placeholder="Например: Пол вымыт дочиста, пахнет свежим мылом..." maxlength="250" rows="3"></textarea>
        </div>

        <div class="section-box">
          <span class="section-badge">Цвет текста</span>
          <div id="colorsContainer" class="colors-grid"></div>
        </div>

        <div class="two-col-grid">
          <div class="section-box">
            <span class="section-badge">Время нахождения</span>
            <div id="durationsContainer" class="pills-grid"></div>
          </div>
          <div class="section-box">
            <span class="section-badge">Дальность видимости</span>
            <div id="distancesContainer" class="pills-grid"></div>
          </div>
        </div>

        <div class="actions-row">
          <button id="btnConfirm" class="btn-primary" style="flex: 1;">
            <span>Перейти к установке (ЛКМ)</span>
          </button>
          <button id="btnCancel" class="btn-secondary" style="width: 90px;">Отмена</button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО 2: Список моих сцен (/scenes) -->
  <div id="myScenesApp" class="modal-overlay" style="display: none;">
    <div id="myScenesWindow" class="modal-card" style="width: 580px;">
      <div class="modal-header" id="myScenesModalHeader">
        <div class="header-left">
          <h2>Мои активные сцены</h2>
        </div>
        <button id="btnMyScenesCloseHeader" class="close-btn" title="Закрыть (Esc)">&times;</button>
      </div>

      <div class="modal-body">
        <div class="section-box" style="gap: 8px;">
          <div class="section-header-row">
            <span class="section-badge">Список созданных сцен</span>
            <span id="myScenesCountBadge" class="char-counter">0 / 5</span>
          </div>
          <p class="section-desc">Здесь отображаются все ваши сцены в мире. Вы можете удалить любую из них.</p>
          
          <div id="myScenesListContainer" class="scenes-list-container">
            <!-- Динамический список сцен -->
          </div>
        </div>

        <div class="actions-row">
          <button id="btnDeleteAllMyScenes" class="btn-danger" style="flex: 1;">
            <span>Удалить все мои сцены</span>
          </button>
          <button id="btnMyScenesCancel" class="btn-secondary" style="width: 90px;">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

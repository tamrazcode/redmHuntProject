<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>HUNT: Grid Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Marck+Script&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=58">
</head>

<body>
  <div id="inventoryApp" class="inventory-screen" style="display: none;">
    <div class="inventory-layout">
      <aside class="equipment-panel" id="equipmentPanel">
        <div class="section-header equipment-panel-header">
          <span class="section-title">Экипировка</span>
        </div>
        <div class="equipment-stage">
          <img id="characterSilhouette" class="character-silhouette" src="images/character_silhouette_male.png?v=4"
            alt="Силуэт персонажа" draggable="false">
          <div class="equipment-grid" id="grid-equipment" data-container="equipment"></div>
        </div>
        <div class="equipment-weight-container" id="equipmentWeightContainer">
          <div class="equipment-weight-header">
            <span class="weight-label">
              <svg class="weight-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v17"></path>
                <path d="M5 21h14"></path>
                <path d="M4 7h16"></path>
                <path d="M4 7l-2.5 7h5L4 7z"></path>
                <path d="M20 7l-2.5 7h5L20 7z"></path>
              </svg>
              Вес
            </span>
            <span class="weight-value" id="equipmentWeightValue">
              <span class="weight-current">0.0</span>
              <span class="weight-divider">/</span>
              <span class="weight-max">30.0</span>
              <span class="weight-unit">кг</span>
            </span>
          </div>
          <div class="weight-bar-track">
            <div class="weight-bar-fill" id="equipmentWeightBar" style="width: 0%;"></div>
          </div>
        </div>
      </aside>

      <!-- ЛЕВАЯ КОЛОНКА: ОСНОВНОЙ СЕТОЧНЫЙ ИНВЕНТАРЬ -->
      <div class="inv-column left-column">
        <div class="grid-section" id="section-main">
          <div class="section-header">
            <span class="section-title">Основной</span>
          </div>
          <div class="grid-container" id="grid-main" data-container="main">
            <!-- Генерируется динамически (10x6 ячеек) -->
          </div>
        </div>
        <div id="clothing-storage-sections"></div>
      </div>

      <!-- ПРАВАЯ КОЛОНКА: ПРЕДМЕТЫ РЯДОМ (НА ЗЕМЛЕ) -->
      <div class="inv-column right-column" id="columnGround">
        <div class="grid-section" id="section-ground">
          <div class="section-header">
            <span class="section-title">Рядом</span>
          </div>
          <div class="grid-scroll-container" id="ground-scroll-container">
            <div class="grid-container" id="grid-ground" data-container="ground">
              <!-- Генерируется динамически (7xN ячеек с поддержкой скролла) -->
            </div>
          </div>
        </div>
        <div id="zombie-storage-sections"></div>
      </div>

    </div>

    <!-- ПЛАВАЮЩАЯ ПАНЕЛЬ ПОДТВЕРЖДЕНИЯ ПАКЕТНОЙ ПЕРЕДАЧИ -->
    <div id="inventoryQuickSlots" class="inventory-quick-slots" aria-label="Быстрые слоты">
      <div class="inventory-quick-side inventory-quick-left">
        <div class="inventory-quick-slot inventory-quick-slot-small inventory-quick-slot-left-far quick-slot-target" data-slot="3">
          <span class="inventory-quick-key">3</span><div class="inventory-quick-content"></div>
        </div>
        <div class="inventory-quick-slot inventory-quick-slot-large inventory-quick-slot-left-near quick-slot-target" data-slot="1">
          <span class="inventory-quick-key">1</span><div class="inventory-quick-content"></div>
        </div>
      </div>
      <div class="inventory-quick-side inventory-quick-right">
        <div class="inventory-quick-slot inventory-quick-slot-large inventory-quick-slot-right-near quick-slot-target" data-slot="2">
          <span class="inventory-quick-key">2</span><div class="inventory-quick-content"></div>
        </div>
        <div class="inventory-quick-slot inventory-quick-slot-small inventory-quick-slot-right-far quick-slot-target" data-slot="4">
          <span class="inventory-quick-key">4</span><div class="inventory-quick-content"></div>
        </div>
      </div>
    </div>

    <div id="transferActionBar" class="transfer-action-bar" style="display: none;">
      <div class="transfer-bar-info">
        <span class="transfer-bar-count" id="transferSelectedCount">Выбрано: 1 предм.</span>
      </div>
      <div class="transfer-bar-buttons">
        <button class="transfer-btn secondary" onclick="clearBatchSelection()">Сбросить</button>
        <button class="transfer-btn primary" id="btnConfirmBatchTransfer"
          onclick="confirmBatchTransfer()">Передать</button>
      </div>
    </div>

    <!-- ПРИЗРАК ПЕРЕТАСКИВАЕМОГО ПРЕДМЕТА -->
    <!-- ПРИЗРАК ПЕРЕТАСКИВАЕМОГО ПРЕДМЕТА -->
    <div id="dragGhost" class="drag-ghost" style="display: none;"></div>

    <!-- ТУЛТИП ПРИ НАВЕДЕНИИ МЫШИ НА ПРЕДМЕТ -->
    <div id="itemHoverTooltip" class="item-hover-tooltip" style="display: none;">
      <div class="tooltip-header">
        <span class="tooltip-title" id="ttTitle">Название</span>
      </div>
      <div class="tooltip-desc" id="ttDesc">Описание...</div>
      <div class="tooltip-meta" id="ttMeta">
        <div class="tooltip-insulation" id="ttInsulation" style="display: none;"></div>
        <span id="ttGender" style="display: none;"></span>
        <span id="ttWeight">0.3 кг</span>
        <span id="ttCount">1 шт.</span>
      </div>
    </div>

    <!-- КОНТЕКСТНОЕ МЕНЮ ПРЕДМЕТА (ПКМ) -->
    <div id="itemContextMenu" class="context-menu" style="display: none;">
      <div class="context-actions">
        <button class="context-btn" id="btnContextPickup" onclick="executeContextAction('pickup')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M19 12l-7 7-7-7" />
          </svg>
          Подобрать
        </button>
        <button class="context-btn" id="btnContextOpenContainer" onclick="executeContextAction('open')"
          style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3m18 0v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8m18 0H3m6 4h6" />
          </svg>
          Открыть
        </button>
        <button class="context-btn" id="btnContextUse" onclick="executeContextAction('use')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          Использовать
        </button>
        <button class="context-btn" id="btnContextNotebookRead" onclick="executeContextAction('read')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
          Прочитать
        </button>
        <button class="context-btn" id="btnContextNotebookWrite" onclick="executeContextAction('write')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          Написать
        </button>
        <button class="context-btn" id="btnContextNotebookTear" onclick="executeContextAction('tear_page')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" stroke-dasharray="2 2" />
          </svg>
          <span id="btnContextNotebookTearText">Вырвать лист</span>
        </button>
        <button class="context-btn" id="btnContextPosition" onclick="executeContextAction('position')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="7" cy="17" r="1.7" />
            <path d="M7 15.3V5m0 0L4.5 7.5M7 5l2.5 2.5" />
            <path d="M8.7 17H19m0 0l-2.5-2.5M19 17l-2.5 2.5" />
            <path d="M8.2 15.8l7.3-7.3m0 0h-3.6m3.6 0v3.6" />
          </svg>
          Расположение
        </button>
        <button class="context-btn" id="btnContextPlace" onclick="executeContextAction('place')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="12" y1="3" x2="12" y2="15" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="4" y1="20" x2="20" y2="20" />
          </svg>
          Разместить
        </button>
        <button class="context-btn" id="btnContextSplit" onclick="executeContextAction('split')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="12" x2="20" y2="12" />
            <circle cx="12" cy="5.5" r="2" fill="currentColor" />
            <circle cx="12" cy="18.5" r="2" fill="currentColor" />
          </svg>
          Разделить
        </button>
        <button class="context-btn" id="btnContextTransfer" onclick="executeContextAction('transfer')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Передать
        </button>
        <button class="context-btn danger" id="btnContextDrop" onclick="executeContextAction('drop')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          Выбросить
        </button>
      </div>
    </div>

    <!-- ОКНО БЛОКНОТА (АУТЕНТИЧНЫЙ ВИД БЕЗ ЛИШНИХ РАМОК) -->
    <div id="notebookEditor" class="notebook-overlay" style="display: none;">
      <div class="notebook-book" id="notebookBook" role="dialog" aria-modal="true" aria-label="Блокнот">
        <div class="notebook-sheet">
          <div class="notebook-toolbar" id="notebookToolbar">
            <div class="notebook-toolbar-actions" id="notebookToolbarActions">
              <button type="button" class="notebook-ink-btn font-bold" data-command="bold" title="Жирный (B)">B</button>
              <button type="button" class="notebook-ink-btn font-italic" data-command="italic"
                title="Курсив (I)">I</button>
              <button type="button" class="notebook-ink-btn font-underline" data-command="underline"
                title="Подчёркнутый (U)">U</button>

              <span class="notebook-ink-sep"></span>

              <label class="notebook-ink-btn notebook-color-label" title="Цвет чернил">
                <span class="notebook-glyph-a">A</span>
                <input id="notebookTextColor" type="color" value="#1a202c" aria-label="Цвет чернил">
              </label>

              <label class="notebook-ink-btn notebook-color-label notebook-highlight-label" title="Цвет маркера">
                <span class="notebook-glyph-a-highlight">A</span>
                <input id="notebookHighlightColor" type="color" value="#fef08a" aria-label="Цвет маркера">
              </label>

              <button type="button" class="notebook-ink-btn" id="btnNotebookAlign" title="Выравнивание текста">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <line x1="3" y1="6" x2="21" y2="6" />
                  <line x1="3" y1="12" x2="15" y2="12" />
                  <line x1="3" y1="18" x2="18" y2="18" />
                </svg>
              </button>

              <button type="button" class="notebook-ink-btn" id="btnNotebookImage"
                title="Вставить изображение по ссылке">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                  stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <polyline points="21 15 16 10 5 21" />
                </svg>
              </button>

              <button type="button" class="notebook-ink-btn notebook-clear-format" id="btnNotebookClearFormat"
                title="Очистить форматирование">Tₓ</button>
            </div>
            <button type="button" class="notebook-close-btn" id="btnNotebookCloseTop" title="Закрыть">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>

          <div class="notebook-page-scroll" id="notebookPageScroll">
            <div id="notebookContent" class="notebook-content" contenteditable="true" spellcheck="false"
              data-placeholder="Начните писать здесь…"></div>
          </div>
        </div>
      </div>

      <!-- ПЛАВАЮЩИЙ ТУЛБАР УПРАВЛЕНИЯ ВЫДЕЛЕННЫМ ИЗОБРАЖЕНИЕМ (ПОВЕРХ ВСЕХ СЛОЕВ) -->
      <div id="notebookImgControls" class="notebook-img-controls" style="display: none;">
        <div class="notebook-img-controls-bar">
          <button type="button" class="notebook-img-btn" id="btnImgAlignLeft" title="Обтекание слева">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 3h16v2H2V3zm0 4h6v6H2V7zm8 0h8v2h-8V7zm0 4h8v2h-8v-2zm-8 4h16v2H2v-2z" />
            </svg>
          </button>
          <button type="button" class="notebook-img-btn" id="btnImgAlignCenter" title="По центру">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 3h16v2H2V3zm3 4h10v6H5V7zm-3 8h16v2H2v-2z" />
            </svg>
          </button>
          <button type="button" class="notebook-img-btn" id="btnImgAlignRight" title="Обтекание справа">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 3h16v2H2V3zm0 4h8v2H2V7zm0 4h8v2H2v-2zm10-4h6v6h-6V7zm-10 8h16v2H2v-2z" />
            </svg>
          </button>
          <span class="notebook-img-sep"></span>
          <button type="button" class="notebook-img-btn text-size" id="btnImgSize25" title="Маленький (25%)">S</button>
          <button type="button" class="notebook-img-btn text-size" id="btnImgSize50" title="Средний (50%)">M</button>
          <button type="button" class="notebook-img-btn text-size" id="btnImgSize75" title="Большой (75%)">L</button>
          <button type="button" class="notebook-img-btn text-size" id="btnImgSize100"
            title="На всю ширину (100%)">MAX</button>
          <span class="notebook-img-sep"></span>
          <button type="button" class="notebook-img-btn delete-btn" id="btnImgDelete" title="Удалить картинку">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </div>
        <div id="notebookImgResizer" class="notebook-img-resizer" title="Потяните для изменения размера"></div>
      </div>

      <div id="notebookImageDialog" class="notebook-image-dialog" style="display: none;" role="dialog"
        aria-label="Вставить изображение">
        <div class="notebook-dialog-box">
          <div class="notebook-dialog-title">Изображение по ссылке</div>
          <input id="notebookImageUrl" class="notebook-dialog-input" type="url"
            placeholder="https://i.ibb.co/... или прямая ссылка" autocomplete="off">
          <div class="notebook-dialog-hint">Рекомендуются ImgBB, Postimages, Yapx (Imgur в РФ блокируется провайдерами
            без VPN).</div>
          <div class="notebook-dialog-actions">
            <button type="button" class="notebook-dialog-btn secondary" id="btnNotebookImageCancel">Отмена</button>
            <button type="button" class="notebook-dialog-btn primary" id="btnNotebookImageInsert">Вставить</button>
          </div>
        </div>
      </div>
    </div>

    <div id="splitModal" class="modal-overlay" style="display: none;">
      <div class="modal-card modal-small">
        <div class="modal-header">
          <span>Разделить стак</span>
          <button class="modal-close" onclick="closeSplitModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="split-item-preview" id="splitItemPreview">
            <span class="split-item-name" id="splitItemName">Бутылка</span>
            <span class="split-item-total" id="splitItemTotal">Всего: 2</span>
          </div>
          <div class="amount-input-box">
            <button class="amount-step-btn" onclick="stepSplitAmount(-1)">-</button>
            <input type="number" id="splitAmountInput" class="amount-input" min="1" value="1"
              oninput="validateSplitInput()">
            <button class="amount-step-btn" onclick="stepSplitAmount(1)">+</button>
          </div>
          <div class="split-quick-buttons">
            <button class="split-quick-btn" onclick="setSplitAmount(1)">1</button>
            <button class="split-quick-btn" onclick="setSplitFraction(0.5)">1/2</button>
            <button class="split-quick-btn" onclick="setSplitMax()">Все</button>
          </div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn secondary" onclick="closeSplitModal()">Отмена</button>
          <button class="modal-btn primary" onclick="confirmSplit()">Разделить</button>
        </div>
      </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ВВОД КОЛИЧЕСТВА ПРЕДМЕТА (ПЕРЕДАЧА / ВЫБРАСЫВАНИЕ) -->
    <div id="amountModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <span id="amountModalTitle">Количество</span>
          <button class="modal-close" onclick="closeAmountModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="amount-input-box">
            <button class="amount-step-btn" onclick="stepAmount(-1)">-</button>
            <input type="number" id="amountInput" class="amount-input" min="1" value="1">
            <button class="amount-step-btn" onclick="stepAmount(1)">+</button>
          </div>
          <div class="amount-max-hint">Максимум: <span id="amountMaxVal">1</span></div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn secondary" onclick="closeAmountModal()">Отмена</button>
          <button class="modal-btn primary" onclick="confirmAmount()">Подтвердить</button>
        </div>
      </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО КОНТЕЙНЕРА (МЕШОК, СУМКА, СВЯЗКА КЛЮЧЕЙ) -->
    <div id="containerModal" class="container-modal" style="display: none;">
      <div class="container-window" id="containerWindow">
        <div class="container-header" id="containerHeader">
          <span class="container-title" id="containerTitle">Контейнер</span>
          <button type="button" class="container-close-btn" id="btnContainerClose"
            onclick="closeContainerWindow()">&times;</button>
        </div>
        <div class="container-body">
          <div class="grid-container container-grid" id="grid-container" data-container="container:0"></div>
        </div>
      </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ВЫБОР ИГРОКА ДЛЯ ПЕРЕДАЧИ (РАДИУС 2.5М) -->
    <div id="playersModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <span>Передать игроку рядом</span>
          <button class="modal-close" onclick="closePlayersModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="players-list" id="nearbyPlayersContainer">
            <!-- Загрузка игроков рядом -->
          </div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn secondary" onclick="closePlayersModal()">Отмена</button>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js?v=55"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Взаимодействие</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Точка прицела при наведении на интерактивный объект -->
  <div id="reticleDot" class="reticle-dot" style="display: none;"></div>

  <!-- Радиальное меню взаимодействия -->
  <div id="interactionOverlay" class="interaction-overlay" style="display: none;">
    <div id="radialContainer" class="radial-container">
      
      <!-- Центральный маркер / якорь -->
      <div class="radial-center-dot"></div>

      <!-- Круговые кнопки действий с индивидуальными подписями -->
      <div id="radialButtonsWrapper" class="radial-buttons-wrapper"></div>

      <!-- Резервный тултип (для совместимости) -->
      <div id="actionTooltip" class="action-tooltip" style="display: none;">
        <span id="tooltipLabel" class="tooltip-label"></span>
      </div>

    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ИНФОРМАЦИИ ОБ ОБЪЕКТЕ -->
  <div id="objectInfoModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="objectInfoTitle">Информация</h2>
        <button class="close-btn" onclick="closeObjectInfo()">&times;</button>
      </div>
      <div class="modal-body" id="objectInfoRows">
        <!-- Динамические строки информации -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

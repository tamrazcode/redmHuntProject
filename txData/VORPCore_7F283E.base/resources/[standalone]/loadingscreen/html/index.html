<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="assets/css/style.css">
	<script type="text/javascript" src="assets/js/jquery.min.js"></script>
	<title>Загрузка мира</title>
</head>
<body>
	<div class="vignette-overlay"></div>

	<!-- Текст подсказок по выживанию (БЕЗ ФОНА И КАРТОЧЕК) -->
	<div class="tip-wrapper">
		<p id="survivalTip" class="survival-tip-text">Загрузка мира...</p>
	</div>

	<!-- Тонкая аккуратная полоса загрузки внизу -->
	<div class="loading-bar-wrapper">
		<div class="bar-track">
			<div class="bar-fill"></div>
		</div>
		<span id="loadPercent" class="load-percent">0%</span>
	</div>

	<script type="text/javascript" src="assets/js/script.js"></script>
</body>
